<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3"/>

  <!-- Center Shield polygon -->
  <path d="M 256,76 L 396,140 L 396,280 C 396,370 256,436 256,436 C 256,436 116,370 116,280 L 116,140 Z"
        fill="url(#shieldGrad)" stroke="#818cf8" stroke-width="6"/>

  <!-- Golden Stars for Tranz India Dealer Excellence -->
  <path d="M 256,118 L 262,134 L 279,134 L 265,144 L 270,160 L 256,150 L 242,160 L 247,144 L 233,134 L 250,134 Z" fill="url(#goldGrad)"/>
  <circle cx="186" cy="154" r="5" fill="#fbbf24"/>
  <circle cx="326" cy="154" r="5" fill="#fbbf24"/>

  <!-- SG Monogram -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="118" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4" filter="url(#glow)">
    SG
  </text>

  <!-- Subtitle Tag inside shield -->
  <rect x="156" y="316" width="200" height="34" rx="17" fill="#fbbf24"/>
  <text x="256" y="339" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="15" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">
    SMART GROUP
  </text>

  <text x="256" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="13" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="2">
    TRANZ INDIA DEALER
  </text>
</svg>
